[project]
name = "ddd-spec"
version = "0.1.0"
description = "The reference validator for ddd-spec domain models."
authors = [
    { name = "benomahony", email = "bomarni@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "rfc3986-validator>=0.1.1",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
]

[project.scripts]
ddd-spec = "ddd_spec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "ddd_spec/spec"
