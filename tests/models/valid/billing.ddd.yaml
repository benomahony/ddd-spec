ddd: 0
kind: BoundedContext
id: acme/billing
purpose: Turn fulfilled orders into invoices and collect payment.
language:
  customer: The party an invoice is addressed to and who owes payment.
inbound:
  - from: acme/sales
    command: IssueInvoice
outbound:
  - to: acme/shipping
    event: InvoicePaid
relationships:
  - with: acme/sales
    pattern: customer-supplier
    side: upstream
    as: [open-host-service]
  - with: acme/shipping
    pattern: upstream-downstream
    side: upstream
    as: [published-language]
---
ddd: 0
kind: Aggregate
id: acme/billing/Invoice
handles: [IssueInvoice]
emits: [InvoicePaid]
