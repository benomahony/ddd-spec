name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: The schema is valid JSON Schema
        run: uvx check-jsonschema --check-metaschema ddd.schema.json
      - name: Every valid fixture passes
        run: uvx check-jsonschema --schemafile ddd.schema.json tests/valid/*.yaml
      - name: Every invalid fixture fails
        run: |
          status=0
          for fixture in tests/invalid/*.yaml; do
            if uvx check-jsonschema --schemafile ddd.schema.json "$fixture" > /dev/null; then
              echo "::error file=$fixture::passed but should fail"
              status=1
            fi
          done
          exit $status

  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv run pytest
